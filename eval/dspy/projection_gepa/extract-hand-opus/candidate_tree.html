<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }

<script type="module">
const NODES = [{"idx": 0, "score": 0.8927, "parents": "seed", "role": "Seed", "components": {"answer": "You read a didi's question about how her SHG savings would grow and write down the scenario as JSON.\nCode does all the arithmetic and draws the chart, so never compute balances. Her savings register is below.\n\nReply with one JSON object only: {\"follow_up\": null or \"<one short question in Hindi>\", \"new_deposit\": <rupees a month>, \"months\": <number or null>, \"target\": <rupees or null>, \"annual_rate\": <percent a year, 0 if none>, \"lump_sum\": <one-time deposit, 0 if none>}\n\nNumbers may be in words: \u092a\u091a\u093e\u0938 50, \u0938\u094c 100, \u0921\u0947\u0922\u093c \u0938\u094c 150, \u0926\u094b \u0938\u094c 200, \u0922\u093e\u0908 \u0938\u094c 250, \u092a\u093e\u0901\u091a \u0938\u094c 500, \u0939\u091c\u093c\u093e\u0930 1000;\n\u090f\u0915 \u0938\u093e\u0932 12 months, \u0921\u0947\u0922\u093c \u0938\u093e\u0932 18, \u0926\u094b \u0938\u093e\u0932 24, \u0924\u0940\u0928 \u0938\u093e\u0932 36. She may type Hindi in English letters.\n- \"\u20b9x \u0914\u0930/\u091c\u093c\u094d\u092f\u093e\u0926\u093e/extra\" -> new_deposit = her current deposit + x. \"x \u0915\u092e/\u0918\u091f\u093e\" -> her deposit \u2212 x. \"\u0905\u092c \u0938\u0947 \u20b9y\" -> y.\n  \"\u0926\u094b\u0917\u0941\u0928\u0940/double\" -> 2 \u00d7 her deposit. \"p% \u092c\u0922\u093c\u093e\" -> her deposit \u00d7 (1 + p/100). Otherwise new_deposit = her deposit.\n- months: the period she said. None given -> 12.\n- target: when she asks how long until a sum (\"\u0915\u092c \u0924\u0915 \u20b920,000\", \"\u0915\u093f\u0924\u0928\u0947 \u092e\u0939\u0940\u0928\u0947 \u0932\u0917\u0947\u0902\u0917\u0947\"), the sum here, months null.\n- annual_rate: only a rate she names (SHG savings earn none otherwise): 0.\n- lump_sum: a one-time amount she will deposit now (\"\u090f\u0915 \u092c\u093e\u0930 \u092e\u0947\u0902\", \"\u092c\u0947\u091a\u0915\u0930 \u092e\u093f\u0932\u0947 \u0939\u0948\u0902, \u091c\u092e\u093e \u0915\u0930 \u0926\u0942\u0901\"), else 0.\n- If she wants to save more but gives no amount, set follow_up to one short kind Hindi question asking how much more\n  a month. Never guess an amount.\nExample: deposit \u20b9200; \"\u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u0921\u0947\u0922\u093c \u0938\u094c \u0914\u0930 \u0921\u093e\u0932\u0942\u0901 \u0924\u094b \u0926\u094b \u0938\u093e\u0932 \u092c\u093e\u0926?\" ->\n{\"follow_up\": null, \"new_deposit\": 350, \"months\": 24, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}"}},
{"idx": 1, "score": 1.0, "parents": "0", "role": "Best", "components": {"answer": "You read a didi's question about how her SHG (self-help group) savings would grow and write down the scenario as JSON. Code does all the arithmetic and draws the chart, so never compute balances, totals or targets yourself. Her savings register is given with the question. It contains her name, her total savings so far, her current monthly deposit (\"\u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u20b9X \u091c\u092e\u093e\") and the next month. Her current deposit is the \u20b9X in \"\u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u20b9X \u091c\u092e\u093e\".\n\nReply with one JSON object only, with no explanation:\n{\"follow_up\": null or \"<one short question in Hindi>\", \"new_deposit\": <rupees a month>, \"months\": <number or null>, \"target\": <rupees or null>, \"annual_rate\": <percent a year, 0 if none>, \"lump_sum\": <one-time deposit, 0 if none>}\n\nReading numbers\n- Numbers may be written as words: \u092a\u091a\u093e\u0938 50, \u0938\u094c 100, \u0921\u0947\u0922\u093c \u0938\u094c 150, \u0926\u094b \u0938\u094c 200, \u0922\u093e\u0908 \u0938\u094c 250, \u0924\u0940\u0928 \u0938\u094c 300, \u091a\u093e\u0930 \u0938\u094c 400, \u092a\u093e\u0901\u091a \u0938\u094c 500, \u0939\u091c\u093c\u093e\u0930 1000, \u0926\u094b \u0939\u091c\u093c\u093e\u0930 2000, \u092a\u093e\u0901\u091a \u0939\u091c\u093c\u093e\u0930 5000.\n- Periods may be written as words: \u0924\u0940\u0928 \u092e\u0939\u0940\u0928\u0947 3, \u091b\u0939 \u092e\u0939\u0940\u0928\u0947 6, \u0928\u094c \u092e\u0939\u0940\u0928\u0947 9, \u090f\u0915 \u0938\u093e\u0932 12 months, \u0921\u0947\u0922\u093c \u0938\u093e\u0932 18, \u0926\u094b \u0938\u093e\u0932 24, \u0924\u0940\u0928 \u0938\u093e\u0932 36.\n- She may type Hindi in English letters, for example \"ab se har mahine 400\", \"do saal baad\", \"double\".\n\nnew_deposit\n- \"\u20b9x \u0914\u0930 / \u091c\u093c\u094d\u092f\u093e\u0926\u093e / extra\" means her current deposit + x.\n- \"x \u0915\u092e / \u0918\u091f\u093e\" means her current deposit \u2212 x.\n- \"\u0905\u092c \u0938\u0947 \u20b9y\", \"\u0905\u092d\u0940 \u0915\u0940 \u091c\u0917\u0939 \u20b9y\" or \"\u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u20b9y \u091c\u092e\u093e \u0915\u0930\u0942\u0901\" means y.\n- \"\u0926\u094b\u0917\u0941\u0928\u0940 / double / \u092c\u091a\u0924 \u0926\u094b\u0917\u0941\u0928\u0940 \u0915\u0930 \u0926\u0942\u0901\" means 2 \u00d7 her current deposit. This IS a complete amount, so do not ask a follow-up.\n- \"\u0924\u093f\u0917\u0941\u0928\u0940\" means 3 \u00d7 her current deposit.\n- \"p% \u092c\u0922\u093c\u093e\" means her current deposit \u00d7 (1 + p/100).\n- Otherwise, new_deposit is her current deposit, unchanged.\n\nmonths\n- Use the period she names.\n- If she names no period and is not asking \"how long until a sum\", use 12. This includes questions like \"\u0915\u093f\u0924\u0928\u093e \u092b\u093c\u093e\u092f\u0926\u093e \u0939\u094b\u0917\u093e?\".\n- If target is set, months is null.\n\ntarget\n- Set target ONLY when she asks how long it takes to reach a sum, for example \"\u0915\u092c \u0924\u0915 \u20b920,000\", \"18000 \u0924\u0915 \u0915\u092c \u092a\u0939\u0941\u0901\u091a\u0947\u0917\u0940\" or \"\u0915\u093f\u0924\u0928\u0947 \u092e\u0939\u0940\u0928\u0947 \u0932\u0917\u0947\u0902\u0917\u0947\". Put that sum here and set months to null.\n- In every other case, target is null.\n- Never put a computed figure in target. For example, doubling the deposit does not create a target.\n\nannual_rate\n- Use only a rate she explicitly names.\n- SHG savings earn no interest otherwise, so the default is 0.\n\nlump_sum\n- Use a one-time amount she will deposit now, for example \"\u090f\u0915 \u092c\u093e\u0930 \u092e\u0947\u0902 \u20b95000\" or \"\u092c\u0915\u0930\u0940 \u092c\u0947\u091a\u0915\u0930 \u092e\u093f\u0932\u0947 \u0939\u0948\u0902, \u091c\u092e\u093e \u0915\u0930 \u0926\u0942\u0901\".\n- Otherwise, lump_sum is 0.\n- Her monthly deposit stays at her current deposit unless she also changes it.\n\nfollow_up (use very rarely)\n- Set follow_up only when she clearly wants to save more but gives NO amount, multiplier or percentage, and the new deposit cannot be worked out. Examples: \"\u0925\u094b\u0921\u093c\u093e \u0914\u0930 \u092c\u091a\u093e\u090a\u0901 \u0924\u094b?\" or \"\u091c\u093c\u094d\u092f\u093e\u0926\u093e \u091c\u092e\u093e \u0915\u0930\u0942\u0901 \u0924\u094b?\".\n- In that case, ask one short kind Hindi question about how much more she wants to save a month, for example \"\u0906\u092a \u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u0915\u093f\u0924\u0928\u0947 \u0930\u0941\u092a\u092f\u0947 \u0914\u0930 \u091c\u092e\u093e \u0915\u0930\u0928\u093e \u091a\u093e\u0939\u0947\u0902\u0917\u0940?\". Never guess an amount.\n- In all other cases, follow_up is null.\n- Do NOT ask a follow-up in these cases:\n  - the question says \u0926\u094b\u0917\u0941\u0928\u0940, double, a percentage, or a specific rupee amount;\n  - it is a target question with no change to her deposit, where you simply use her current deposit;\n  - no period is given, where you use 12.\n- Never ask her to confirm her current deposit.\n\nExamples\n1. Current deposit \u20b9200. Question: \"\u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u0921\u0947\u0922\u093c \u0938\u094c \u0914\u0930 \u0921\u093e\u0932\u0942\u0901 \u0924\u094b \u0926\u094b \u0938\u093e\u0932 \u092c\u093e\u0926?\"\n   {\"follow_up\": null, \"new_deposit\": 350, \"months\": 24, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n2. Current deposit \u20b9150. Question: \"\u0905\u092d\u0940 \u0915\u0940 \u091c\u0917\u0939 \u092e\u0939\u0940\u0928\u0947 \u0915\u0947 \u20b9300 \u092c\u091a\u093e\u090a\u0901 \u0924\u094b \u0928\u094c \u092e\u0939\u0940\u0928\u0947 \u092e\u0947\u0902 \u0915\u093f\u0924\u0928\u093e \u092b\u093c\u0930\u094d\u0915 \u092a\u0921\u093c\u0947\u0917\u093e?\"\n   {\"follow_up\": null, \"new_deposit\": 300, \"months\": 9, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n3. Current deposit \u20b9150. Question: \"\u0905\u092a\u0928\u0940 \u092c\u091a\u0924 \u0926\u094b\u0917\u0941\u0928\u0940 \u0915\u0930 \u0926\u0942\u0901 \u0924\u094b \u0915\u093f\u0924\u0928\u093e \u092b\u093c\u093e\u092f\u0926\u093e \u0939\u094b\u0917\u093e?\"\n   {\"follow_up\": null, \"new_deposit\": 300, \"months\": 12, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n4. Current deposit \u20b9200. Question: \"\u092e\u0947\u0930\u0940 \u092c\u091a\u0924 18000 \u0924\u0915 \u0915\u092c \u092a\u0939\u0941\u0901\u091a\u0947\u0917\u0940?\"\n   {\"follow_up\": null, \"new_deposit\": 200, \"months\": null, \"target\": 18000, \"annual_rate\": 0, \"lump_sum\": 0}\n5. Current deposit \u20b9100. Question: \"\u0905\u0917\u0930 \u092e\u0948\u0902 \u0905\u092d\u0940 \u090f\u0915 \u092c\u093e\u0930 \u092e\u0947\u0902 \u092a\u093e\u0901\u091a \u0939\u091c\u093c\u093e\u0930 \u091c\u092e\u093e \u0915\u0930 \u0926\u0942\u0901 \u0924\u094b \u0924\u0940\u0928 \u092e\u0939\u0940\u0928\u0947 \u092c\u093e\u0926 \u0915\u0941\u0932 \u092c\u091a\u0924 \u0915\u093f\u0924\u0928\u0940 \u0939\u094b\u0917\u0940?\"\n   {\"follow_up\": null, \"new_deposit\": 100, \"months\": 3, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 5000}\n6. Current deposit \u20b9250. Question: \"agar main ab se har mahine 400 rupaye jama karun to do saal baad kitni bachat hogi?\"\n   {\"follow_up\": null, \"new_deposit\": 400, \"months\": 24, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n7. Current deposit \u20b9200. Question: \"\u0925\u094b\u0921\u093c\u093e \u0914\u0930 \u092c\u091a\u093e\u090a\u0901 \u0924\u094b \u090f\u0915 \u0938\u093e\u0932 \u092e\u0947\u0902 \u0915\u093f\u0924\u0928\u093e \u0939\u094b\u0917\u093e?\"\n   {\"follow_up\": \"\u0906\u092a \u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u0915\u093f\u0924\u0928\u0947 \u0930\u0941\u092a\u092f\u0947 \u0914\u0930 \u091c\u092e\u093e \u0915\u0930\u0928\u093e \u091a\u093e\u0939\u0947\u0902\u0917\u0940?\", \"new_deposit\": 200, \"months\": 12, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.89)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(1.00)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
