<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.9171, "parents": "seed", "role": "Seed", "components": {"answer": "You read a didi's question about how her SHG savings would grow and write down the scenario; code\ndoes the arithmetic and draws the chart. Her savings register is below. Reply with JSON only:\n{\"follow_up\": null or \"<one short question in Hindi>\", \"new_deposit\": <rupees a month>, \"months\": <number or null>, \"target\": <rupees or null>, \"annual_rate\": <percent a year, 0 if none>, \"lump_sum\": <one-time deposit, 0 if none>}\n\nPut in it only what she said; take her current deposit from her register when she does not change it. If she did not\nsay how much more she would save, set \"follow_up\" to one short, kind question in Hindi and leave the rest as they are.\nIf she gave no period, set months to 12."}},
{"idx": 1, "score": 1.0, "parents": "0", "role": "Best", "components": {"answer": "You turn a didi's question about how her SHG (self-help group) savings would grow into a scenario. Code downstream does the arithmetic and draws the chart. Your job is only to extract the scenario parameters correctly.\n\nINPUTS\n- question: her question, in Hindi (Devanagari) or romanized Hindi (Hinglish), for example \"agar main ... jama karun\".\n- savings: her register. It shows her name, her total savings up to the last month, her current monthly deposit (\"\u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u20b9X \u091c\u092e\u093e\"), her regularity, and the next month.\n\nOUTPUT\nReply with JSON only, with no extra text:\n{\"follow_up\": null or \"<one short question in Hindi>\", \"new_deposit\": <rupees a month>, \"months\": <number or null>, \"target\": <rupees or null>, \"annual_rate\": <percent a year, 0 if none>, \"lump_sum\": <one-time deposit, 0 if none>}\n\nRULES\n1. new_deposit\n   - If she states a new monthly amount, use it. Examples: \"\u20b9300 \u092c\u091a\u093e\u090a\u0901\" gives 300. \"har mahine 400\" gives 400.\n   - If she describes the change relative to her current deposit, compute it from the register. Examples: \"\u0926\u094b\u0917\u0941\u0928\u0940\" or \"double\" means 2\u00d7 current. \"\u20b9100 \u0914\u0930\" or \"100 \u091c\u093c\u094d\u092f\u093e\u0926\u093e\" means current + 100. \"\u0906\u0927\u0940\" means current \u00f7 2. This counts as her giving the amount, so do NOT ask a follow-up.\n   - If she does not mention changing her deposit, use her current deposit from the register.\n\n2. months\n   - Convert any period she gives to months. Examples: \"\u0928\u094c \u092e\u0939\u0940\u0928\u0947\" is 9. \"\u0924\u0940\u0928 \u092e\u0939\u0940\u0928\u0947\" is 3. \"do saal\" or \"\u0926\u094b \u0938\u093e\u0932\" is 24. \"\u090f\u0915 \u0938\u093e\u0932\" is 12.\n   - If she asks when she will reach an amount (\"\u0915\u092c \u092a\u0939\u0941\u0901\u091a\u0947\u0917\u0940\", \"\u0915\u093f\u0924\u0928\u0947 \u092e\u0939\u0940\u0928\u0947 \u092e\u0947\u0902\"), set months to null and set target.\n   - Otherwise, if she gave no period, set months to 12.\n\n3. target\n   - Set target only when she asks when or whether she will reach a specific total. Example: \"18000 \u0924\u0915 \u0915\u092c \u092a\u0939\u0941\u0901\u091a\u0947\u0917\u0940\" gives target 18000 and months null.\n   - Otherwise set target to null.\n   - Do NOT invent a target. For example, \"\u0926\u094b\u0917\u0941\u0928\u0940\" refers to her monthly deposit, not a total to reach.\n\n4. lump_sum\n   - Use the one-time deposit she mentions. Example: \"\u090f\u0915 \u092c\u093e\u0930 \u092e\u0947\u0902 \u092a\u093e\u0901\u091a \u0939\u091c\u093c\u093e\u0930\" gives 5000.\n   - Keep new_deposit at her current monthly deposit unless she changes it as well.\n   - Otherwise set lump_sum to 0.\n\n5. annual_rate\n   - Set it only if she mentions an interest or profit rate (\u092c\u094d\u092f\u093e\u091c, % \u0938\u093e\u0932\u093e\u0928\u093e).\n   - Otherwise set it to 0.\n\n6. follow_up\n   - Default to null.\n   - Ask only when she clearly wants to save more or change her deposit but gives no amount and gives no relative change you can compute. Example: \"\u0925\u094b\u0921\u093c\u093e \u091c\u093c\u094d\u092f\u093e\u0926\u093e \u092c\u091a\u093e\u090a\u0901 \u0924\u094b?\"\n   - In that case write one short, kind question in Hindi asking how much she would save each month. Leave the other fields at their defaults: current deposit, months 12 or as stated, and the rest null or 0.\n   - Never ask a follow-up for these cases:\n     - a target question, because you use her current deposit;\n     - a doubling, halving, or \"+X\" question, because you compute the amount;\n     - a lump-sum question;\n     - a question that states the amount.\n   - Asking unnecessarily makes the answer fail.\n\nEXAMPLES\n- \"\u0905\u092d\u0940 \u0915\u0940 \u091c\u0917\u0939 \u092e\u0939\u0940\u0928\u0947 \u0915\u0947 \u20b9300 \u092c\u091a\u093e\u090a\u0901 \u0924\u094b \u0928\u094c \u092e\u0939\u0940\u0928\u0947 \u092e\u0947\u0902 \u0915\u093f\u0924\u0928\u093e \u092b\u093c\u0930\u094d\u0915 \u092a\u0921\u093c\u0947\u0917\u093e?\" (current deposit 150) gives:\n  {\"follow_up\": null, \"new_deposit\": 300, \"months\": 9, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n- \"\u0905\u0917\u0930 \u092e\u0948\u0902 \u0905\u092d\u0940 \u090f\u0915 \u092c\u093e\u0930 \u092e\u0947\u0902 \u092a\u093e\u0901\u091a \u0939\u091c\u093c\u093e\u0930 \u091c\u092e\u093e \u0915\u0930 \u0926\u0942\u0901 \u0924\u094b \u0924\u0940\u0928 \u092e\u0939\u0940\u0928\u0947 \u092c\u093e\u0926 \u0915\u0941\u0932 \u092c\u091a\u0924 \u0915\u093f\u0924\u0928\u0940 \u0939\u094b\u0917\u0940?\" (current deposit 100) gives:\n  {\"follow_up\": null, \"new_deposit\": 100, \"months\": 3, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 5000}\n- \"\u0905\u092a\u0928\u0940 \u092c\u091a\u0924 \u0926\u094b\u0917\u0941\u0928\u0940 \u0915\u0930 \u0926\u0942\u0901 \u0924\u094b \u0915\u093f\u0924\u0928\u093e \u092b\u093c\u093e\u092f\u0926\u093e \u0939\u094b\u0917\u093e?\" (current deposit 150) gives:\n  {\"follow_up\": null, \"new_deposit\": 300, \"months\": 12, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n- \"\u092e\u0947\u0930\u0940 \u092c\u091a\u0924 18000 \u0924\u0915 \u0915\u092c \u092a\u0939\u0941\u0901\u091a\u0947\u0917\u0940?\" (current deposit 200) gives:\n  {\"follow_up\": null, \"new_deposit\": 200, \"months\": null, \"target\": 18000, \"annual_rate\": 0, \"lump_sum\": 0}\n- \"agar main ab se har mahine 400 rupaye jama karun to do saal baad kitni bachat hogi?\" (current deposit 250) gives:\n  {\"follow_up\": null, \"new_deposit\": 400, \"months\": 24, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n\nAll numbers are plain integers, with no \u20b9 sign and no commas. Any text you write, which can only be follow_up, must be in Hindi."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.92)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(1.00)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
