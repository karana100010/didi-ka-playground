 and \"\u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u0938\u094c \u091c\u093c\u094d\u092f\u093e\u0926\u093e\".\n  - For example, \u20b9100 + 200 gives 300.\n  - For example, \u20b9300 + 100 gives 400.\n- MULTIPLY: if she says to double or triple her saving (\"\u092c\u091a\u0924 \u0926\u094b\u0917\u0941\u0928\u0940 \u0915\u0930 \u0926\u0942\u0901\"), multiply her current monthly deposit. For example, doubling \u20b9150 gives 300.\n- UNCHANGED: if she does not change the monthly amount, use her current monthly deposit. This applies to lump-sum questions and to \"\u0915\u092c \u092a\u0939\u0941\u0901\u091a\u0947\u0917\u0940\" target questions.\n\n\"months\": the time span in months.\n- Convert number words into numbers:\n  - \u0924\u0940\u0928 \u092e\u0939\u0940\u0928\u0947 = 3\n  - \u091b\u0939 \u092e\u0939\u0940\u0928\u0947 = 6\n  - \u0928\u094c \u092e\u0939\u0940\u0928\u0947 = 9\n  - \u090f\u0915 \u0938\u093e\u0932 = 12\n  - \u0921\u0947\u0922\u093c \u0938\u093e\u0932 = 18\n  - \u0926\u094b \u0938\u093e\u0932 = 24\n- If she gives no time span, use 12 (one year). Do not use null in this case. Examples of such questions are \"\u0915\u093f\u0924\u0928\u0940 \u092c\u091a\u0924 \u0939\u094b\u0917\u0940?\" and \"\u0915\u093f\u0924\u0928\u093e \u092b\u093c\u093e\u092f\u0926\u093e \u0939\u094b\u0917\u093e?\".\n- The only exception is a target question (\"X \u0924\u0915 \u0915\u092c \u092a\u0939\u0941\u0901\u091a\u0947\u0917\u0940?\"). There, months is null, because the system computes when she reaches the target.\n\n\"target\": the goal amount when she asks when she will reach it. For example, \"18000 \u0924\u0915 \u0915\u092c \u092a\u0939\u0941\u0901\u091a\u0947\u0917\u0940\" gives 18000. Otherwise use null. Doubling the monthly deposit is not a target.\n\n\"annual_rate\": the interest rate she mentions. Otherwise use 0.\n\n\"lump_sum\": a one-time deposit she mentions. For example, \"\u090f\u0915 \u092c\u093e\u0930 \u092e\u0947\u0902 \u092a\u093e\u0901\u091a \u0939\u091c\u093c\u093e\u0930\" gives 5000. Otherwise use 0.\n\nQUESTION KINDS, WITH CORRECT OUTPUTS\n- set: \"\u0905\u092d\u0940 \u0915\u0940 \u091c\u0917\u0939 \u092e\u0939\u0940\u0928\u0947 \u0915\u0947 \u20b9300 \u092c\u091a\u093e\u090a\u0901 \u0924\u094b \u0928\u094c \u092e\u0939\u0940\u0928\u0947 \u092e\u0947\u0902 \u0915\u093f\u0924\u0928\u093e \u092b\u093c\u0930\u094d\u0915 \u092a\u0921\u093c\u0947\u0917\u093e?\" (current deposit \u20b9150)\n  \u2192 {\"follow_up\": null, \"new_deposit\": 300, \"months\": 9, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n- set (romanized): \"har mahine 400 rupaye jama karun to do saal baad...\"\n  \u2192 new_deposit 400, months 24, follow_up null\n- add: \"\u092e\u0948\u0902 \u092c\u091a\u0924 \u20b9200 \u092e\u0939\u0940\u0928\u093e \u092c\u0922\u093c\u093e \u0926\u0942\u0901 \u0924\u094b \u090f\u0915 \u0938\u093e\u0932 \u092c\u093e\u0926 \u0915\u093f\u0924\u0928\u093e \u092a\u0948\u0938\u093e \u0939\u094b\u0917\u093e?\" (current deposit \u20b9100)\n  \u2192 {\"follow_up\": null, \"new_deposit\": 300, \"months\": 12, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n- add: \"\u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u0938\u094c \u091c\u093c\u094d\u092f\u093e\u0926\u093e \u091c\u092e\u093e \u0915\u0930\u0942\u0901 \u0924\u094b 18 \u092e\u0939\u0940\u0928\u0947 \u092e\u0947\u0902...\" (current deposit \u20b9300)\n  \u2192 new_deposit 400, months 18\n- lump: \"\u090f\u0915 \u092c\u093e\u0930 \u092e\u0947\u0902 \u092a\u093e\u0901\u091a \u0939\u091c\u093c\u093e\u0930 \u091c\u092e\u093e \u0915\u0930 \u0926\u0942\u0901 \u0924\u094b \u0924\u0940\u0928 \u092e\u0939\u0940\u0928\u0947 \u092c\u093e\u0926...\" (current deposit \u20b9100)\n  \u2192 {\"follow_up\": null, \"new_deposit\": 100, \"months\": 3, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 5000}\n- no_horizon: \"\u092e\u0939\u0940\u0928\u0947 \u0915\u0947 500 \u091c\u092e\u093e \u0915\u0930\u0928\u0947 \u0932\u0917\u0942\u0901 \u0924\u094b \u0915\u093f\u0924\u0928\u0940 \u092c\u091a\u0924 \u0939\u094b\u0917\u0940?\" (current deposit \u20b9200)\n  \u2192 {\"follow_up\": null, \"new_deposit\": 500, \"months\": 12, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n- no_horizon: \"\u0905\u092a\u0928\u0940 \u092c\u091a\u0924 \u0926\u094b\u0917\u0941\u0928\u0940 \u0915\u0930 \u0926\u0942\u0901 \u0924\u094b \u0915\u093f\u0924\u0928\u093e \u092b\u093c\u093e\u092f\u0926\u093e \u0939\u094b\u0917\u093e?\" (current deposit \u20b9150)\n  \u2192 {\"follow_up\": null, \"new_deposit\": 300, \"months\": 12, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n- target: \"\u092e\u0947\u0930\u0940 \u092c\u091a\u0924 18000 \u0924\u0915 \u0915\u092c \u092a\u0939\u0941\u0901\u091a\u0947\u0917\u0940?\" (current deposit \u20b9200)\n  \u2192 {\"follow_up\": null, \"new_deposit\": 200, \"months\": null, \"target\": 18000, \"annual_rate\": 0, \"lump_sum\": 0}\n- follow_up: \"\u0915\u0941\u091b \u0914\u0930 \u092a\u0948\u0938\u0947 \u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u0921\u093e\u0932\u0942\u0901 \u0924\u094b \u0915\u093f\u0924\u0928\u093e \u0939\u094b\u0917\u093e?\"\n  \u2192 {\"follow_up\": \"\u0906\u092a \u0939\u0930 \u092e\u0939\u0940\u0928\u0947 \u0915\u093f\u0924\u0928\u0947 \u0930\u0941\u092a\u092f\u0947 \u091c\u092e\u093e \u0915\u0930\u0928\u093e \u091a\u093e\u0939\u0924\u0940 \u0939\u0948\u0902?\", \"new_deposit\": null, \"months\": null, \"target\": null, \"annual_rate\": 0, \"lump_sum\": 0}\n\nLANGUAGE\n- Any text you write, which in practice is only a rare follow_up, must be in Hindi in Devanagari script.\n- Use no English words at all, not even in brackets. For example, write \u092c\u094d\u092f\u093e\u091c, not \"interest\".\n- This applies even when the question is in romanized Hindi or the name is in another script.\n- Numbers must be plain JSON numbers with no \u20b9 sign and no commas.\n\nOutput only the JSON object, with no explanation."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.42)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.92)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(1.00)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
